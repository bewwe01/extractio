name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Optional release key from repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SAVEIT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SAVEIT_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > saveit-release.jks
          printf 'storeFile=saveit-release.jks\nstorePassword=%s\nkeyAlias=saveit\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Unit tests, lint, debug + release APKs
        run: ./gradlew test lintDebug assembleDebug assembleRelease --stacktrace

      - name: Verify APK signatures and packaged engine
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            "$BT/apksigner" verify --print-certs "$apk" | head -3
            unzip -l "$apk" | grep -E "lib/.*/lib(python|ffmpeg|ffprobe|qjs)" | awk '{print $4}' | sort | head -20
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saveit-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore

  # Installs the RELEASE build on an emulator, launches it, shares a link into it and fails on any crash
  # or if the bundled Python/yt-dlp/ffmpeg engine does not initialize.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: saveit-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r "$(find apks -name 'app-universal-release.apk' | head -1)"
            adb logcat -c
            adb shell am start -W -n app.saveit/.MainActivity
            sleep 45
            adb shell "am start -W -a android.intent.action.SEND -t text/plain --es android.intent.extra.TEXT 'Look at this https://www.pinterest.com/pin/1084663891475263837/ via Pinterest' -n app.saveit/.MainActivity" | tee share.txt
            if grep -q "Error" share.txt; then echo "Share intent was not delivered"; exit 1; fi
            sleep 40
            adb exec-out screencap -p > smoke-screenshot.png
            adb logcat -d > logcat.txt
            grep -E "SaveIt|AndroidRuntime|FATAL" logcat.txt | tail -80 || true
            if grep -q "FATAL EXCEPTION" logcat.txt; then echo "App crashed"; exit 1; fi
            grep -q "Engine ready" logcat.txt || { echo "Engine did not initialize"; exit 1; }
            grep -qE "SaveItHome: (Resolved|Analyze failed)" logcat.txt || { echo "Shared link was not analyzed"; exit 1; }
            grep -q "SaveItHome: Resolved PINTEREST" logcat.txt || echo "WARNING: shared Pinterest link did not resolve (see log above)"
            adb shell pidof app.saveit || { echo "App not running"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            smoke-screenshot.png
            logcat.txt
          if-no-files-found: ignore
